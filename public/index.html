<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2 Mensonges, 1 Vérité</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #2b1055; --bg2: #7597de;
    --card: rgba(255,255,255,.96); --ink: #1d1530; --muted: #6b6480;
    --accent: #ff5d8f; --accent2: #7c4dff; --good: #22c55e; --bad: #ef4444; --gold: #fbbf24;
    --r: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Fredoka', system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), #5b2a86 45%, var(--bg2)) fixed;
    min-height: 100vh; padding: 16px 16px 40px;
  }
  #app { max-width: 560px; margin: 0 auto; }
  h1 { color: #fff; text-align: center; font-size: 2rem; margin: 12px 0 4px; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .tag { color: #f3e8ff; text-align: center; margin: 0 0 20px; opacity: .9; }
  .card { background: var(--card); border-radius: var(--r); padding: 18px; margin-bottom: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .card h2 { margin: 0 0 10px; font-size: 1.3rem; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  input, textarea {
    width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid #e5e0f0;
    background: #fff; color: var(--ink); outline: none; transition: border-color .15s;
  }
  input:focus, textarea:focus { border-color: var(--accent2); }
  textarea { resize: vertical; min-height: 70px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 13px 18px; cursor: pointer;
    background: var(--accent); color: #fff; box-shadow: 0 4px 0 #c93a69; transition: transform .08s, box-shadow .08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c93a69; }
  button.alt { background: var(--accent2); box-shadow: 0 4px 0 #5530c0; }
  button.ghost { background: #efeaf7; color: var(--ink); box-shadow: 0 4px 0 #d7cfe6; }
  button:disabled { opacity: .5; cursor: default; }
  .full { width: 100%; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .stack > * + * { margin-top: 10px; }
  .code { font-size: 2.6rem; letter-spacing: .3em; font-weight: 700; color: var(--accent2); text-align: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #efeaf7; font-size: .9rem; }
  .players { display: flex; flex-wrap: wrap; gap: 8px; }
  .player { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: #f6f3fb; }
  .player.off { opacity: .4; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 1.2rem; flex: none; }
  .av.sm { width: 24px; height: 24px; font-size: .85rem; display: inline-grid; vertical-align: middle; }
  .av.lg { width: 84px; height: 84px; font-size: 2.8rem; margin: 0 auto; }
  .anec { position: relative; padding: 14px 14px 14px 52px; border-radius: 14px; background: #f6f3fb; margin-bottom: 10px; line-height: 1.35; border: 3px solid transparent; }
  .anec .l { position: absolute; left: 12px; top: 12px; width: 28px; height: 28px; border-radius: 8px; background: var(--accent2); color: #fff; display: grid; place-items: center; font-weight: 700; }
  button.anec { width: 100%; text-align: left; color: var(--ink); font-weight: 500; box-shadow: none; }
  button.anec:hover { border-color: #d6c8f5; }
  .anec.sel { border-color: var(--accent2); background: #ede6ff; }
  .anec.true { border-color: var(--good); background: #e8fbef; }
  .anec.false { opacity: .65; }
  .anec .voters { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .badge { position: absolute; right: 10px; top: -10px; font-size: .75rem; padding: 2px 8px; border-radius: 999px; color: #fff; font-weight: 600; }
  .badge.t { background: var(--good); } .badge.f { background: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  button.pick { background: #f6f3fb; color: var(--ink); box-shadow: 0 4px 0 #ddd3ee; display: flex; align-items: center; gap: 10px; padding: 10px; border: 3px solid transparent; }
  button.pick.sel { border-color: var(--accent2); background: #ede6ff; }
  .truth { display: flex; align-items: center; gap: 8px; margin: 6px 0 14px; font-size: .95rem; cursor: pointer; user-select: none; }
  .truth input { width: 20px; height: 20px; accent-color: var(--good); }
  .phase { color: #fff; text-align: center; margin: 4px 0 12px; }
  .phase .step { font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .phase .t { font-size: 1.5rem; font-weight: 700; }
  .progress { height: 8px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: var(--gold); transition: width .3s; }
  .score { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #eee8f6; }
  .score:last-child { border-bottom: 0; }
  .score .n { flex: 1; font-weight: 500; }
  .score .p { font-weight: 700; }
  .plus { color: var(--good); font-weight: 700; font-size: .9rem; margin-right: 6px; }
  .gains .g { padding: 8px 0; border-bottom: 1px dashed #e8e1f3; }
  .gains .g:last-child { border-bottom: 0; }
  .gains ul { margin: 4px 0 0 44px; padding: 0; list-style: none; font-size: .9rem; color: var(--muted); }
  .reveal { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .wait { display: inline-block; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d1530; color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 9; max-width: 90vw; }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin: 10px 0 4px; }
  .podium .col { text-align: center; width: 30%; }
  .podium .bar { border-radius: 12px 12px 0 0; color: #fff; font-weight: 700; padding-top: 8px; font-size: 1.4rem; }
  .award { display: flex; gap: 12px; align-items: center; padding: 8px 0; }
  .award .e { font-size: 1.8rem; }
  details summary { cursor: pointer; color: var(--muted); }
  .rules li { margin-bottom: 4px; }
  a.link { color: var(--accent2); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $app = document.getElementById('app');
let S = null;          // état reçu du serveur
let lastKey = null;    // pour ne pas tout redessiner (et perdre le focus)
let draft = JSON.parse(localStorage.getItem('draft') || 'null') || { texts: ['', '', ''], trueIndex: null };

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = (id) => S.players.find((p) => p.id === id);
const av = (p, cls = '') => p ? `<span class="av ${cls}" style="background:${p.color}33">${p.avatar}</span>` : '';
const me = () => P(S.you);
const isHost = () => S.hostId === S.you;
const L = ['A', 'B', 'C'];

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

// ─── Connexion / reconnexion ────────────────────────────────────────────
socket.on('connect', () => {
  const saved = JSON.parse(localStorage.getItem('session') || 'null');
  if (saved) socket.emit('rejoin', saved);
  else renderHome();
});
socket.on('rejoinFailed', () => { localStorage.removeItem('session'); S = null; renderHome(); });
socket.on('joined', (d) => localStorage.setItem('session', JSON.stringify(d)));
socket.on('errorMsg', toast);
socket.on('state', (s) => { S = s; render(); });

// ─── Accueil ────────────────────────────────────────────────────────────
function renderHome() {
  lastKey = 'home';
  const params = new URLSearchParams(location.search);
  const code = params.get('salon') || '';
  $app.innerHTML = `
    <h1>🎭 2 Mensonges, 1 Vérité</h1>
    <p class="tag">Devine qui a écrit… puis démasque le menteur.</p>
    <div class="card stack">
      <input id="name" maxlength="20" placeholder="Ton pseudo" value="${esc(localStorage.getItem('name') || '')}" />
      <button class="full" id="create">Créer un salon</button>
    </div>
    <div class="card stack">
      <h2>Rejoindre un salon</h2>
      <input id="code" maxlength="4" placeholder="CODE" value="${esc(code)}" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700" />
      <button class="full alt" id="join">Rejoindre</button>
    </div>
    ${rulesCard()}`;
  const name = () => { const n = document.getElementById('name').value.trim(); localStorage.setItem('name', n); return n; };
  document.getElementById('create').onclick = () => socket.emit('create', { name: name() });
  document.getElementById('join').onclick = () => socket.emit('join', { name: name(), code: document.getElementById('code').value });
}

function rulesCard(open = false) {
  return `<div class="card"><details ${open ? 'open' : ''}><summary><b>Règles & points</b></summary>
    <ol class="rules">
      <li>Chacun écrit <b>3 anecdotes</b> sur lui : <b>2 fausses, 1 vraie</b>.</li>
      <li>Les anecdotes d'un joueur s'affichent, <b>sans son nom</b>. Tout le monde vote : <b>qui a écrit ça ?</b> (style, fautes, émojis… tout est indice). L'auteur vote aussi, pour brouiller les pistes.</li>
      <li>On révèle l'auteur… puis on vote : <b>laquelle est vraie ?</b></li>
    </ol>
    <div class="muted" style="font-size:.92rem">
      🔍 Auteur démasqué : <b>+100</b> · ✅ Vraie anecdote trouvée : <b>+100</b> · 🕵️ Les deux : <b>+50</b> bonus<br>
      🥸 Tu es l'auteur : <b>+50</b> par joueur qui ne t'a pas reconnu, 👻 <b>+100</b> si personne<br>
      🤥 <b>+75</b> par joueur berné par un mensonge, 🎭 <b>+150</b> si personne ne trouve la vérité<br>
      🫣 Accusé à tort : <b>+25</b> par vote (merci pour la diversion)
    </div></details></div>`;
}

// ─── Rendu principal ────────────────────────────────────────────────────
function screenKey() {
  const c = S.current || {};
  const mine = S.players.find((p) => p.id === S.you);
  const online = S.players.filter((p) => p.connected).length;
  return [S.phase, S.round, S.hostId, c.myVote, mine && mine.submitted, S.phase === 'lobby' ? online : ''].join('|');
}

function render() {
  const key = screenKey();
  if (S.phase === 'end' && draft.texts.some(Boolean)) { draft = { texts: ['', '', ''], trueIndex: null }; saveDraft(); }
  if (key !== lastKey) {
    lastKey = key;
    const fn = { lobby: lobby, writing: writing, guessAuthor: guessAuthor, revealAuthor: revealAuthor, guessTrue: guessTrue, revealTrue: revealTrue, end: end }[S.phase];
    $app.innerHTML = fn();
    bind();
  }
  // parties « vivantes » mises à jour sans tout redessiner
  document.querySelectorAll('[data-live]').forEach((el) => { el.innerHTML = LIVE[el.dataset.live](); });
}

const header = (step, title) => `
  <div class="progress"><div style="width:${S.totalRounds ? ((S.round - 1) / S.totalRounds) * 100 : 0}%"></div></div>
  <div class="phase"><div class="step">${step}</div><div class="t">${title}</div></div>`;

const anecList = (opts = {}) => S.current.items.map((t, i) => {
  const c = S.current;
  let cls = 'anec', badge = '', voters = '';
  if (opts.showTruth && c.trueIndex != null) {
    cls += i === c.trueIndex ? ' true' : (opts.dimFalse ? ' false' : '');
    badge = i === c.trueIndex ? '<span class="badge t">VRAIE</span>' : '<span class="badge f">FAUSSE</span>';
  }
  if (opts.votes) {
    const v = Object.entries(opts.votes).filter(([, idx]) => idx === i).map(([pid]) => av(P(pid), 'sm')).join('');
    voters = v ? `<div class="voters">${v}</div>` : '';
  }
  if (opts.clickable) {
    if (c.myVote === i) cls += ' sel';
    return `<button class="${cls}" data-true="${i}"><span class="l">${L[i]}</span>${esc(t)}</button>`;
  }
  return `<div class="${cls}">${badge}<span class="l">${L[i]}</span>${esc(t)}${voters}</div>`;
}).join('');

const LIVE = {
  lobbyPlayers: () => S.players.map((p) => `<div class="player ${p.connected ? '' : 'off'}">${av(p)}<span>${esc(p.name)}${p.id === S.hostId ? ' 👑' : ''}${p.id === S.you ? ' (toi)' : ''}</span></div>`).join(''),
  writingStatus: () => {
    const done = S.players.filter((p) => p.submitted).length;
    return `<div class="muted" style="margin-bottom:8px">${done} / ${S.players.filter((p) => p.connected).length} prêts</div>
      <div class="players">${S.players.map((p) => `<div class="player ${p.connected ? '' : 'off'}">${av(p)}<span>${esc(p.name)} ${p.submitted ? '✅' : '<span class="wait">✍️</span>'}</span></div>`).join('')}</div>`;
  },
  voteCount: () => `<span class="pill">🗳️ ${S.current.voted} / ${S.current.needed} votes</span>`,
  waitTrue: () => `<div class="players">${(S.current.waitingFor || []).map((id) => `<div class="player">${av(P(id))}<span>${esc(P(id).name)} <span class="wait">🤔</span></span></div>`).join('') || '<span class="muted">Tout le monde a voté !</span>'}</div>`,
  scores: () => scoreboard(),
  hostBtn: () => '',
};

function scoreboard(gainsList = []) {
  const totals = {};
  for (const g of gainsList) if (g) for (const [pid, x] of Object.entries(g)) totals[pid] = (totals[pid] || 0) + x.total;
  return [...S.players].sort((a, b) => b.score - a.score).map((p, i) => `
    <div class="score"><b style="width:22px">${i + 1}</b>${av(p)}<span class="n">${esc(p.name)}${p.id === S.you ? ' (toi)' : ''}</span>
    ${totals[p.id] ? `<span class="plus">+${totals[p.id]}</span>` : ''}<span class="p">${p.score}</span></div>`).join('');
}

function gainsBlock(gains) {
  const ids = Object.keys(gains || {}).sort((a, b) => gains[b].total - gains[a].total);
  if (!ids.length) return '<div class="muted">Personne ne marque de points cette fois.</div>';
  return `<div class="gains">${ids.map((id) => `
    <div class="g"><div style="display:flex;align-items:center;gap:10px">${av(P(id))}<b style="flex:1">${esc(P(id)?.name || '?')}</b><span class="plus">+${gains[id].total}</span></div>
    <ul>${gains[id].reasons.map((r) => `<li>+${r.pts} · ${esc(r.label)}</li>`).join('')}</ul></div>`).join('')}</div>`;
}

const hostNext = (label, extra = '') => isHost()
  ? `<button class="full alt" data-next>${label}</button>${extra}`
  : `<p class="center" style="color:#fff">En attente de l'hôte ${esc(P(S.hostId)?.name || '')} 👑…</p>`;

const forceBtn = (label) => isHost() ? `<p class="center"><a class="link" data-next style="color:#fff">${label}</a></p>` : '';

// ─── Écrans ─────────────────────────────────────────────────────────────
function lobby() {
  const url = `${location.origin}/?salon=${S.code}`;
  const n = S.players.filter((p) => p.connected).length;
  return `
    <h1>🎭 Salon</h1>
    <div class="card center">
      <div class="muted">Code du salon</div>
      <div class="code">${S.code}</div>
      <button class="ghost" data-copy="${esc(url)}">📋 Copier le lien d'invitation</button>
    </div>
    <div class="card"><h2>Joueurs</h2><div class="players" data-live="lobbyPlayers"></div></div>
    ${isHost()
      ? `<button class="full" data-start ${n < 3 ? 'disabled' : ''}>${n < 3 ? `Encore ${3 - n} joueur(s) minimum…` : 'Lancer la partie 🚀'}</button>`
      : `<p class="center" style="color:#fff">L'hôte va lancer la partie…</p>`}
    <div style="height:14px"></div>
    ${rulesCard()}
    <p class="center"><a class="link" data-leave style="color:#fff">Quitter le salon</a></p>`;
}

function writing() {
  if (me().submitted) {
    return `
      <div class="phase"><div class="step">Préparation</div><div class="t">C'est envoyé ! 🤫</div></div>
      <div class="card"><div data-live="writingStatus"></div></div>
      <button class="full ghost" data-edit>✏️ Modifier mes anecdotes</button>
      <div style="height:10px"></div>
      ${forceBtn('Commencer sans les retardataires')}`;
  }
  if (S.myAnecdotes) draft = { texts: S.myAnecdotes.map((a) => a.text), trueIndex: S.myAnecdotes.findIndex((a) => a.isTrue) };
  return `
    <div class="phase"><div class="step">Préparation</div><div class="t">Écris tes 3 anecdotes</div></div>
    <div class="card">
      <p class="muted" style="margin-top:0">2 fausses, 1 vraie. Coche la vraie. 💡 Astuce : tu peux imiter le style d'un autre pour brouiller les pistes…</p>
      ${[0, 1, 2].map((i) => `
        <textarea data-t="${i}" maxlength="280" placeholder="Anecdote ${L[i]}…">${esc(draft.texts[i] || '')}</textarea>
        <label class="truth"><input type="radio" name="truth" value="${i}" ${draft.trueIndex === i ? 'checked' : ''}/> C'est la vraie</label>`).join('')}
      <button class="full" data-submit>Valider 🔒</button>
    </div>
    <div class="card"><div data-live="writingStatus"></div></div>`;
}

function guessAuthor() {
  const c = S.current;
  const others = S.players.filter((p) => p.id !== S.you);
  return `
    ${header(`Manche ${S.round} / ${S.totalRounds} · Étape 1`, 'Qui a écrit ça ? 🕵️')}
    <div class="card">
      ${c.isAuthor ? `<p style="margin-top:0"><b>🤫 C'est toi !</b> Fais comme si de rien n'était et vote pour quelqu'un d'autre.</p>` : ''}
      ${anecList()}
    </div>
    <div class="card">
      <h2>${c.isAuthor ? 'Vote pour faire diversion' : 'Ton suspect'}</h2>
      <div class="grid">${others.map((p) => `<button class="pick ${c.myVote === p.id ? 'sel' : ''}" data-author="${p.id}">${av(p)}<span>${esc(p.name)}</span></button>`).join('')}</div>
      <p class="center" data-live="voteCount"></p>
    </div>
    ${forceBtn('Révéler maintenant')}`;
}

function revealAuthor() {
  const c = S.current;
  const a = P(c.authorId);
  const votes = Object.entries(c.authorVotes || {});
  return `
    ${header(`Manche ${S.round} / ${S.totalRounds} · Révélation`, "C'était…")}
    <div class="card center reveal">
      ${av(a, 'lg')}
      <h2 style="margin:10px 0 0;font-size:1.8rem">${esc(a.name)} !</h2>
    </div>
    <div class="card">
      <h2>Les votes</h2>
      ${votes.map(([v, t]) => `<div class="score">${av(P(v))}<span class="n">${esc(P(v)?.name)} → ${av(P(t), 'sm')} ${esc(P(t)?.name || '?')}</span>${t === c.authorId ? '✅' : '❌'}</div>`).join('') || '<span class="muted">Aucun vote</span>'}
    </div>
    <div class="card"><h2>Points</h2>${gainsBlock(c.authorGains)}</div>
    ${hostNext('Trouver la vraie anecdote →')}`;
}

function guessTrue() {
  const c = S.current;
  const a = P(c.authorId);
  if (c.isAuthor) {
    return `
      ${header(`Manche ${S.round} / ${S.totalRounds} · Étape 2`, 'Regarde-les galérer 😈')}
      <div class="card">${anecList({ showTruth: true })}</div>
      <div class="card"><h2>Ils réfléchissent…</h2><div data-live="waitTrue"></div></div>
      ${forceBtn('Révéler maintenant')}`;
  }
  return `
    ${header(`Manche ${S.round} / ${S.totalRounds} · Étape 2`, 'Laquelle est vraie ? 🤔')}
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">${av(a)}<b>${esc(a.name)}</b> dit la vérité sur une seule :</div>
      ${anecList({ clickable: true })}
      <p class="center" data-live="voteCount"></p>
    </div>
    ${forceBtn('Révéler maintenant')}`;
}

function revealTrue() {
  const c = S.current;
  const a = P(c.authorId);
  const last = S.round >= S.totalRounds;
  return `
    ${header(`Manche ${S.round} / ${S.totalRounds} · Verdict`, `La vérité sur ${esc(a.name)}`)}
    <div class="card reveal">${anecList({ showTruth: true, dimFalse: true, votes: c.trueVotes })}</div>
    <div class="card"><h2>Points</h2>${gainsBlock(c.trueGains)}</div>
    <div class="card"><h2>Classement</h2>${scoreboard([c.authorGains, c.trueGains])}</div>
    ${hostNext(last ? 'Voir le podium 🏆' : 'Manche suivante →')}`;
}

function end() {
  const ranked = [...S.players].sort((a, b) => b.score - a.score);
  const podium = [ranked[1], ranked[0], ranked[2]];
  const h = [110, 150, 80], col = ['#94a3b8', '#fbbf24', '#d97706'], pos = [2, 1, 3];
  return `
    <h1>🏆 Fin de partie</h1>
    <div class="card">
      <div class="podium">${podium.map((p, i) => p ? `
        <div class="col reveal">${av(p)}<div style="font-weight:600;margin:4px 0">${esc(p.name)}</div><div class="muted">${p.score} pts</div>
        <div class="bar" style="height:${h[i]}px;background:${col[i]}">${pos[i]}</div></div>` : '<div class="col"></div>').join('')}</div>
    </div>
    ${S.awards.length ? `<div class="card"><h2>Trophées</h2>${S.awards.map((w) => `
      <div class="award"><span class="e">${w.emoji}</span><div><b>${w.title}</b> — ${w.winners.map((id) => esc(P(id)?.name)).join(' & ')}<div class="muted" style="font-size:.9rem">${w.desc} (${w.value})</div></div></div>`).join('')}</div>` : ''}
    <div class="card"><h2>Classement</h2>${scoreboard()}</div>
    ${hostNext('Rejouer 🔁')}
    <p class="center"><a class="link" data-leave style="color:#fff">Quitter</a></p>`;
}

// ─── Événements ─────────────────────────────────────────────────────────
function saveDraft() { localStorage.setItem('draft', JSON.stringify(draft)); }

function bind() {
  const on = (sel, fn) => document.querySelectorAll(sel).forEach((el) => el.addEventListener('click', fn));
  on('[data-start]', () => socket.emit('start'));
  on('[data-next]', () => socket.emit('next'));
  on('[data-leave]', () => { socket.emit('leave'); localStorage.removeItem('session'); S = null; renderHome(); });
  on('[data-copy]', (e) => { navigator.clipboard?.writeText(e.currentTarget.dataset.copy).then(() => toast('Lien copié !'), () => toast(e.currentTarget.dataset.copy)); });
  on('[data-author]', (e) => socket.emit('voteAuthor', e.currentTarget.dataset.author));
  on('[data-true]', (e) => socket.emit('voteTrue', Number(e.currentTarget.dataset.true)));
  on('[data-edit]', () => socket.emit('editAnecdotes'));
  document.querySelectorAll('[data-t]').forEach((el) => el.addEventListener('input', () => { draft.texts[+el.dataset.t] = el.value; saveDraft(); }));
  document.querySelectorAll('input[name=truth]').forEach((el) => el.addEventListener('change', () => { draft.trueIndex = +el.value; saveDraft(); }));
  on('[data-submit]', () => {
    if (draft.texts.some((t) => !t || t.trim().length < 3)) return toast('Remplis les 3 anecdotes');
    if (draft.trueIndex == null || draft.trueIndex < 0) return toast('Coche celle qui est vraie');
    socket.emit('submitAnecdotes', draft);
  });
}
</script>
</body>
</html>
